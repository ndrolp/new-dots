# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
windowrulev2 = float, class:(yad)

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = no_focus on,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrulev2 = float, class:(waypaper)
windowrulev2 = float, class:(org.gnome.Calculator)
windowrulev2 = float, class:(floatprueba)
windowrulev2 = float, class:(ristretto)
windowrulev2 = float, class:(org.pulseaudio.pavucontrol)
windowrulev2 = float, class:(protonvpn-app)
windowrulev2 = float, class:(blueman)

windowrulev2 = workspace 8, class:(Spotify)
windowrulev2 = workspace 6, class:(WebCord)
windowrulev2 = workspace 3, class:(Google-chrome)
windowrulev2 = workspace 3, class:(google-chrome)
windowrulev2 = workspace 5, class:(org.kde.dolphin)
windowrulev2 = workspace 4, class:(nemo)
windowrulev2 = workspace 9, class:(Docker Desktop)
windowrulev2 = workspace special, class:(xwaylandvideobridge)


# windowrule = size 767x969, class:(ristretto)
layerrule = blur on, match:class wofi
layerrule = blur on, match:class eww
layerrule = blur on, match:class ^(tofi)
layerrule = blur on, match:class ^(Tofi)
layerrule = blur on, match:class eww-volume
layerrule = blur on, match:class mako
layerrule = blur on, match:class swaync
layerrule = blur on, match:class swaync-client
# layerrule = blur, swayosd

# CONFIGURATION MANAGERS
windowrulev2 = float, match:class (blueman-manager)
windowrulev2 = float, title:^(i18n Manager)
windowrule = size 400x500, match:class (blueman-manager)

windowrulev2 = float, class:(nm-connection-editor)
windowrule = size 400x500, match:class (nm-connection-editor)
windowrule = size 400x500, match:class (protonvpn-app)

windowrulev2 = float, class:(pavucontrol-qt)
windowrule = size 600x700, match:class (pavucontrol-qt)


windowrule = opacity 0.9 override 0.9 override 1.0 override, match:class nemo
windowrule = opacity 0.9 override 0.9 override 1.0 override, match:class org.kde.dolphin
windowrule = opacity 0.9 override 0.9 override 1.0 override, match:class org.kde.krusader
windowrule = opacity 0.9 override 0.9 override 1.0 override, match:class org.kde.krusader
windowrule = opacity 0.80 override 0.9 override 1.0 override, match:class Spotify
windowrule = opacity 0.95 override 0.95 override 1.0 override, match:class DBeaver
windowrule = opacity 0.85 override 0.85 override 1.0 override, match:class Code
windowrule = opacity 0.95 override 0.95 override 1.0 override, match:class jetbrains-studio
windowrule = opacity 0.95 override 0.95 override 1.0 override, match:class jetbrains-idea-ce
windowrule = opacity 0.95 override 0.95 override 1.0 override, match:class ^(Tomekeeper)$

# Disable animations for specific Eww layer surfaces
# layerrule = noanim on, match:class eww-volume

windowrule = size 500x700, match:class (vlc)
windowrulev2 = float, class:(vlc)

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

layerrule = blur on, match:class swaync-control-center
layerrule = blur on, match:class swaync-notification-window

# layerrule = ignorezero, swaync-control-center
# layerrule = ignorezero, swaync-notification-window

layerrule = ignore_alpha 0.5, match:class swaync-control-center
layerrule = ignore_alpha 0.5, match:class swaync-notification-window

# layerrule = blur on,match:class rofi
windowrule {
  name = animate-rofi
  match:class = rofi

  # move = 100 100
  animation = popin
}


bezier = overshoot, 0.05, 0.9, 0.1, 1.1

animation = layersIn, 1, 4, overshoot, popin 40%
animation = layersOut, 1, 1, default, popin 0%
# animation = layersIn, 1, 8, default, popin 80%



