# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = GeistMono Nerd Font Propo
source = ~/.config/hypr/custom/hyprlock-colors.conf

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 0.9
    brightness = 0.62
    vibrancy = 0.12
    vibrancy_darkness = 0.1
}

shape {
    monitor =
    size = 440, 450
    color = $card
    rounding = 20
    border_size = 1
    border_color = $border
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 56, 56
    color = $accent
    rounding = 28
    position = 0, 154
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾
    color = $background
    font_size = 28
    font_family = $font
    position = 0, 154
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    inner_color = $input

    outer_color = $accent
    check_color = $green
    fail_color = $red

    font_color = $text
    fade_on_empty = true
    rounding = 14

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL

    dots_size = 0.28
    dots_spacing = 0.22

    position = 0, -64
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    color = $text

    position = 0, 76
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 16
    font_family = $font
    color = $muted

    position = 0, 24
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = $font
    color = $text
    position = 0, -132
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter password to unlock
    font_size = 11
    font_family = $font
    color = $muted
    position = 0, -158
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/spotify-playing.sh)"
    font_size = 15
    font_family = $font
    color = $muted
    onclick = hyprctl switchxkblayout all next
    position = 0, 48
    halign = center
    valign = south
}
