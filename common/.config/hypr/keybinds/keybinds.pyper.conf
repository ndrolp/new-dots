$pypr = uwsm-app -- pypr

bind = $mainMod SHIFT,  Z, exec, $pypr zoom
bind = $mainMod ALT,    P, exec, $pypr toggle_dpms
bind = $mainMod SHIFT,  O, exec, $pypr shift_monitors +1
bind = $mainMod,        B, exec, $pypr expose
# bind = $mainMod,        K, exec, $pypr change_workspace +1
# bind = $mainMod,        J, exec, $pypr change_workspace -1
# bind = $mainMod,        L, exec, $pypr toggle_dpms
bind = $mainMod  SHIFT, M, exec, $pypr toggle stb stb-logs
bind = $mainMod,        A, exec, $pypr toggle term
bind = $mainMod,        V, exec, $pypr toggle volume
# Setup the key binding
bind = $mainMod, B, exec, pypr expose
bind = $mainMod, M, exec, pypr menu

# Add some style to the "exposed" workspace
workspace = special:exposed,gapsout:60,gapsin:30,bordersize:5,border:true,shadow:false

bind = $win, M, exec, pypr layout_center toggle # toggle the layout
## focus change keys
bind = $win SHIFT, h, exec, pypr layout_center prev
bind = $win SHIFT, l, exec, pypr layout_center next
bind = $win SHIFT, k, exec, pypr layout_center prev2
bind = $win SHIFT, j, exec, pypr layout_center next2
