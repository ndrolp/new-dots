#### WALLPAPER  ####
bind = $mainMod SHIFT, F, exec, ~/.dotfiles/scripts/hyprland/wallpaper.sh
#### SCREENSHOT ####
bind = SUPER SHIFT, S, exec, ~/.dotfiles/scripts/screenshots/basic.sh
bind = SUPER SHIFT, C, exec, ~/.dotfiles/common/.config/hypr/themes/bar/waybar/custom/colorpicker.sh
bind = SUPER SHIFT, C, exec, ~/.dotfiles/common/.config/hypr/themes/bar/waybar/custom/colorpicker.sh
bind = SUPER, L, exec, hyprlock 
### OTHERS ### 
bind = $mainMod SHIFT, w, exec, killall -SIGUSR1 waybar
bind = $mainMod, n, exec, swaync-client -t -sw
bind = $mainMod SHIFT, n, exec, ~/Documentos/Tools/rofi-wifi-menu/rofi-wifi-menu.sh
bind = $mainMod, E, exec, rofi -show emoji -no-show-icons
bind = $mainMod, P, exec, quickshell ipc --path ~/.config/quickshell call config toggle
bind = $mainMod SHIFT, T, fullscreen
bind = SUPER, T, exec, ~/.dotfiles/colorschemes/colorscheme_changer.sh
bind = $mainMod SHIFT, O, exec, ~/.config/ags/reload.sh 

bind = SUPER SHIFT, M, exec, ~/.dotfiles/scripts/hyprland/music_setup.sh
